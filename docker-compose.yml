services:
  postgres:
    image: postgres:16-alpine
    container_name: watertriage-db
    environment:
      POSTGRES_USER: jjm_user
      POSTGRES_PASSWORD: jjm_password
      POSTGRES_DB: jjm_triage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jjm_user -d jjm_triage"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: watertriage-backend
    environment:
      DATABASE_URL: postgresql://jjm_user:jjm_password@postgres:5432/jjm_triage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: watertriage-dashboard
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
