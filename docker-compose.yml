services:
  postgres:
    image: postgres:16-alpine
    container_name: watertriage-db
    environment:
      POSTGRES_USER: jjm_user
      POSTGRES_PASSWORD: jjm_password
      POSTGRES_DB: jjm_triage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jjm_user -d jjm_triage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
